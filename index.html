<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Commande RCLP</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
    font-family:Segoe UI,sans-serif;
    margin:0;
    background:#f5f6f8;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    padding:10px;
    background:white;
}

.tab{
    border:none;
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:10px;
    background:white;
}

input{
    padding:10px;
}

.card{
    background:white;
    margin:10px;
    padding:15px;
    border-radius:12px;
}

#resultatsRecherche{
    background:white;
    border:1px solid #ddd;
    border-radius:8px;
    max-height:300px;
    overflow:auto;
    width:100%;
}

#btnAccueil{
    position:fixed;
    bottom:20px;
    right:20px;
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    background:#1976d2;
    color:white;
    font-size:24px;
    cursor:pointer;
    z-index:9999;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
}
</style>
</head>

<body>

<div id="tabs" class="tabs"></div>

<div class="toolbar">

    <input
        id="search"
        placeholder="Recherche"
        oninput="rechercher()">

    <button onclick="ouvrirAjoutArticle()">➕ Ajouter</button>

    <button onclick="document.getElementById('importExcel').click()">
        📥 Import Excel
    </button>

    <button onclick="sauvegarderJSON()">
        💾 Sauvegarder
    </button>

    <button onclick="document.getElementById('restoreJSON').click()">
        📂 Reprendre
    </button>

    <button onclick="afficherOnglets()">
        📋 Onglets
    </button>

</div>

<div id="resultatsRecherche"></div>

<input
    type="file"
    id="importExcel"
    style="display:none"
    accept=".xlsx"
    onchange="importerExcel(event)">

<input
    type="file"
    id="restoreJSON"
    style="display:none"
    accept=".json"
    onchange="restaurerJSON(event)">

<div id="contenu"></div>

<div id="popupAjout"
     style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9999;">

    <div style="background:white;margin:20px;padding:15px;border-radius:12px;">
        <h3>Nouvel article</h3>

        <input id="newCode" placeholder="Code article" style="width:100%;margin-bottom:8px;">
        <input id="newArticle" placeholder="Nom article" style="width:100%;margin-bottom:8px;">
        <input id="newFournisseur" placeholder="Fournisseur" style="width:100%;margin-bottom:8px;">
        <input id="newConditionnement" placeholder="Conditionnement" style="width:100%;margin-bottom:8px;">
        <input id="newOrdre" type="number" placeholder="Ordre" style="width:100%;margin-bottom:8px;">

        <button onclick="enregistrerArticle()">Enregistrer</button>
        <button onclick="fermerAjoutArticle()">Annuler</button>
    </div>

</div>

<button
    id="btnAccueil"
    onclick="location.href='https://johanschrub-prog.github.io/hotel-paix-hub/'">
🏠
</button>

<script src="app.js"></script>

</body>
</html>
